name: "WhatsApp Home Assistant Bridge"
version: "1.0.0"
slug: "whatsapp_ha_bridge"
description: "WhatsApp Bot Bridge für Home Assistant über WAHA mit KI-Integration"
url: "https://github.com/DeinGitHubBenutzer/DeinRepoName"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Webhook und API Port
schema:
  ADMIN_NUMBER: string
  ALLOWED_USERS: string
  CONVERSATION_AGENT: string
  STT_ENGINE: string
  GROUP_IDS: string
  WAHA_URL: string
  WAHA_API_KEY: password
  WAHA_SESSION: string
  WAHA_WEBHOOK_URL: string
options:
  ADMIN_NUMBER: ""
  ALLOWED_USERS: ""
  CONVERSATION_AGENT: ""
  STT_ENGINE: ""
  GROUP_IDS: ""
  WAHA_URL: "http://192.168.0.2:3100"
  WAHA_API_KEY: ""
  WAHA_SESSION: "default"
  WAHA_WEBHOOK_URL: "http://192.168.0.2:3000/waha/webhook"
environment:
  PORT: "3000"