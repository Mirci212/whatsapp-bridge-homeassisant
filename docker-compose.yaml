services:
  waha:
    image: devlikeapro/waha:latest
    container_name: whatsapp_waha
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY:-dein_langer_zufaelliger_api_key}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WHATSAPP_NOWEB_STORE_ENABLED=true
      - WHATSAPP_NOWEB_STORE_FULL_SYNC=true
      - WHATSAPP_HOOK_URL=http://whatsapp-ha-bridge:3000/waha/webhook
      - WHATSAPP_HOOK_EVENTS=message,poll.vote,session.status
      # Basis-URL, mit der WAHA media.url baut. Muss von der Bridge aus erreichbar
      # sein (Default waere localhost = die Bridge fragt sich selbst -> 404).
      - WAHA_BASE_URL=http://waha:3000
    volumes:
      - waha_sessions:/app/.sessions

  whatsapp-ha-bridge:
    image: ghcr.io/mirci212/whatsapp-bridge-homeassisant:latest
    container_name: whatsapp-bridge-homeassisant
    restart: unless-stopped
    depends_on:
      - waha
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Vienna
      - PORT=3000
      - HA_URL=http://192.168.0.2:8123
      - HA_TOKEN=dein_long_lived_access_token
      - CONVERSATION_AGENT=conversation.gemini_live
      - ALLOWED_USERS=436***:Marco,43****:Brigitte
      - STT_ENGINE=stt.faster_whisper
      - GROUP_IDS=120363012345678@g.us:Familie
      - ADMIN_NUMBER=436***
      - WAHA_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY:-dein_langer_zufaelliger_api_key}
      - WAHA_SESSION=default
      - WAHA_WEBHOOK_URL=http://whatsapp-ha-bridge:3000/waha/webhook

volumes:
  waha_sessions: